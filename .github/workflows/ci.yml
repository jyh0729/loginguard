name: CI

on:
  push:
    branches: [main, week7, week8]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test (가짜 RBA 데이터로 피처·학습·API·로그 테스트)
        run: pytest -q

      - name: Docker build
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t loginguard:ci .

      - name: Container smoke test
        run: |
          docker run -d --name lg -p 8000:8000 loginguard:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"user_id":"ci","ip":"10.0.0.1","country":"KR","success":true}'
          docker logs lg | tail -20
