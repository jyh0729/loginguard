services:
  loginguard:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: loginguard:${APP_VERSION:-dev}
    container_name: loginguard
    ports:
      - "${HOST_PORT:-8000}:8000"        # EC2 에서는 HOST_PORT=80
    environment:
      APP_VERSION: ${APP_VERSION:-dev}
      MODEL_SOURCE: ${MODEL_SOURCE:-demo}   # demo: 가짜 데이터로 빠르게 / rba: 실제 RBA 데이터로 학습
      RBA_ROWS: ${RBA_ROWS:-2000000}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      CLOUDWATCH_LOG_GROUP: ${CLOUDWATCH_LOG_GROUP:-}   # 비어 있으면 파일 로그만
      LOG_FILE: logs/predictions.jsonl
    volumes:
      - ./logs:/app/logs                  # 예측·정답 로그
      - ./models:/app/models              # 학습한 모델 (컨테이너를 다시 만들어도 재학습 안 함)
      - ./data:/app/data                  # 받은 데이터
    restart: unless-stopped
